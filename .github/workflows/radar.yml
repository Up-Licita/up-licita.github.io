# Roda o Radar automaticamente 2x por dia (horários em UTC):
#   10:07 UTC = 07:07 em Brasília  |  19:07 UTC = 16:07 em Brasília
# Também pode ser disparado na mão pela aba "Actions" -> "Run workflow".
name: Radar de Licitações

on:
  schedule:
    - cron: "7 10 * * *"
    - cron: "7 19 * * *"
  workflow_dispatch:
  # Roda também quando o código é atualizado (exceto a memória do robô)
  push:
    branches: [main]
    paths-ignore:
      - "estado/**"
      - "README.md"

permissions:
  contents: write   # necessário para salvar estado/vistos.json no repositório

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Executar radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ALIMENTACAO: ${{ secrets.TELEGRAM_CHAT_ALIMENTACAO }}
          TELEGRAM_CHAT_CONSTRUCAO: ${{ secrets.TELEGRAM_CHAT_CONSTRUCAO }}
        run: python main.py --dias 1

      - name: Salvar memória (licitações já enviadas)
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add estado/vistos.json || true
          git diff --cached --quiet || git commit -m "radar: atualiza estado"
          git push || true
