# Radar de Licitações — roda sozinho 2x por dia (horários em UTC):
#   09:37 UTC = 06:37 em Brasília  |  18:37 UTC = 15:37 em Brasília
# A cada execução: coleta no PNCP -> alertas no Telegram -> publica o site.
name: Radar de Licitações

on:
  schedule:
    - cron: "37 9 * * *"
    - cron: "37 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "estado/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m unittest discover -s tests -t .

      # Memória do robô (licitações já enviadas) guardada no cache do GitHub
      - name: Restaurar memória
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: radar-estado-${{ github.run_id }}
          restore-keys: radar-estado-

      - name: Executar radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ALIMENTACAO: ${{ secrets.TELEGRAM_CHAT_ALIMENTACAO }}
          TELEGRAM_CHAT_CONSTRUCAO: ${{ secrets.TELEGRAM_CHAT_CONSTRUCAO }}
        run: python main.py

      - name: Salvar memória
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado
          key: radar-estado-${{ github.run_id }}

      - name: Preparar publicação do site
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar site
        id: deploy
        uses: actions/deploy-pages@v4
